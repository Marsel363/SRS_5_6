{% load static %}

<div class="col-12 col-md-6 col-xl-4 tour-column">
    <article class="card h-100 tour-card">
        <a
            href="{% url 'detail' tour.pk %}"
            tabindex="-1"
            aria-hidden="true"
        ><img
            class="card-img-top tour-image"
            src="{% static tour.image %}"
            alt=""
            loading="lazy"
        ></a>

        <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge bg-orange-lt">{{ tour.country.name }} · {{ tour.get_category_display }}</span>

                <button
                    class="btn btn-icon btn-outline-secondary favorite-btn"
                    data-favorite="{{ tour.pk }}"
                    aria-label="Избранное {{ tour.title }}"
                    aria-pressed="{% if tour.pk in favorite_ids %}true{% else %}false{% endif %}"
                >{% if tour.pk in favorite_ids %}♥{% else %}♡{% endif %}</button>
            </div>

            <h3 class="card-title"><a class="text-reset" href="{% url 'detail' tour.pk %}">{{ tour.title }}</a></h3>

            <p class="text-secondary flex-grow-1">{{ tour.description|truncatechars:115 }}</p>

            <div class="d-flex align-items-end justify-content-between gap-2">
                <div>
                    <div class="text-secondary small">{{ tour.duration }} дней · за человека</div>

                    <strong class="fs-2">{{ tour.price }} ₽</strong>
                </div>

                <a
                    class="btn btn-primary"
                    href="{% url 'detail' tour.pk %}"
                >Выбрать тур</a>
            </div>
        </div>
    </article>
</div>
