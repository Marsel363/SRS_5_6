<form id="booking-form">
    {% csrf_token %}

    <input type="hidden" name="tour" value="{{ tour.pk }}">

    <div class="row g-3 mb-3">
        <div class="col-7">
            <label class="form-label" for="departure">Дата поездки</label>

            <input
                class="form-control"
                type="date"
                id="departure"
                name="departure"
                required
            >
        </div>

        <div class="col-5">
            <label class="form-label" for="travelers">Туристов</label>

            <input
                class="form-control"
                type="number"
                id="travelers"
                name="travelers"
                min="1"
                max="10"
                value="1"
                required
            >
        </div>
    </div>

    <div class="d-flex justify-content-between p-3 bg-orange-lt rounded mb-3">
        <span>Итого</span>

        <strong id="quote-total" aria-live="polite">{{ tour.price }} ₽</strong>
    </div>

    <label class="form-label" for="name">Ваше имя</label>

    <input
        class="form-control mb-3"
        id="name"
        name="name"
        minlength="2"
        maxlength="80"
        autocomplete="name"
        required
    >

    <label class="form-label" for="email">Электронная почта</label>

    <input
        class="form-control mb-3"
        id="email"
        type="email"
        name="email"
        maxlength="254"
        autocomplete="email"
        required
    >

    <label class="form-check mb-3"><input
        class="form-check-input"
        type="checkbox"
        name="consent"
        required
    ><span class="form-check-label">Согласен на обработку данных для оформления заявки</span></label>

    <div
        id="booking-message"
        class="alert d-none"
        role="status"
        aria-live="polite"
    ></div>

    <button
        class="btn btn-primary w-100"
        type="submit"
    >Отправить заявку</button>

    <p class="text-secondary small mt-2 mb-0">Заявка сохраняется в вашем браузерном сеансе. Оплата не требуется.</p>
</form>
